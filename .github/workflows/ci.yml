name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Project contract and available tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Install backend dependencies for API contract tests
        shell: bash
        run: |
          if [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
          else
            echo "::warning::backend requirements are not present; API tests may be skipped."
          fi

      - name: Run tests
        run: python -m pytest -q

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies when available
        shell: bash
        run: |
          if [[ ! -d backend ]]; then
            echo "::warning::backend/ is not implemented yet; backend checks are pending."
            exit 0
          fi
          if [[ -f backend/requirements.txt ]]; then
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt
          elif [[ -f backend/pyproject.toml ]]; then
            python -m pip install --upgrade pip
            python -m pip install ./backend
          else
            echo "::error::backend exists but has no requirements.txt or pyproject.toml."
            exit 1
          fi
          python -m pip install ruff pytest

      - name: Run backend lint and tests when available
        shell: bash
        run: |
          if [[ ! -d backend ]]; then
            exit 0
          fi
          python -m ruff check backend tests
          python -m ruff format --check backend tests
          python -m pytest -q tests backend/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build when available
        shell: bash
        run: |
          if [[ ! -d frontend ]]; then
            echo "::warning::frontend/ is not implemented yet; frontend checks are pending."
            exit 0
          fi
          if [[ ! -f frontend/package.json || ! -f frontend/package-lock.json ]]; then
            echo "::error::frontend requires package.json and package-lock.json."
            exit 1
          fi
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run typecheck --prefix frontend
          npm run test --prefix frontend
          npm run build --prefix frontend

  e2e:
    name: Playwright outpatient acceptance flow
    runs-on: ubuntu-latest
    needs: [contract-tests, backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend and E2E dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix tests/e2e

      - name: Install Playwright browser
        run: npx --prefix tests/e2e playwright install --with-deps chromium

      - name: Run browser acceptance flow
        working-directory: tests/e2e
        env:
          CI: "true"
        run: npm test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            tests/e2e/test-results/
          if-no-files-found: warn

  docker-config:
    name: Docker configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose syntax
        run: docker compose config

      - name: Build backend image
        run: docker build --pull --tag his-api:ci ./backend

      - name: Build frontend image
        run: docker build --pull --tag his-web:ci ./frontend

      - name: Build Compose application images
        run: docker compose build --pull api web

      - name: Start and verify local demo containers
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:5173/login
          TOKEN=$(curl --fail -s -X POST http://127.0.0.1:8000/api/auth/login -d 'username=cashier.demo&password=Demo123!' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl --fail -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/api/registrations

      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down

