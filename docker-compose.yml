services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/hospital.sqlite
      JWT_SECRET: ${JWT_SECRET:-local-classroom-demo-change-before-sharing}
      ALLOWED_ORIGINS: http://localhost:5173
      AI_PROVIDER: disabled
    volumes:
      - demo_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  demo_data:
